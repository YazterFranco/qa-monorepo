# Pipeline de QA:
#   lint → typecheck → test-layers ─┬→ e2e por producto (con sharding) → reporte por producto
#                                   └→ docker-e2e: la misma suite dentro de la imagen del
#                                      Dockerfile, con un reporte completo en un solo lugar
#
# El móvil (apps/my-demo-app-e2e) no corre aquí: necesita un emulador Android con aceleración
# por hardware, que no existe dentro de Docker.
#
# Credenciales: hoy no hay ninguna (las demos son públicas). Cuando un ambiente use ${VAR},
# crea el context "qa-e2e" (Organization Settings → Contexts), agrega `context: qa-e2e` a los
# jobs e2e y docker-e2e, y declara la variable en passThroughEnv de test:e2e en turbo.json. En
# docker-e2e, pásala también al contenedor con --env.
version: 2.1

parameters:
  test_env:
    type: string
    default: public-demo
    description: Ambiente de libs/test-data/<producto>/environments que usan los e2e (TEST_ENV).

executors:
  node:
    docker:
      - image: cimg/node:24.22
  playwright:
    # Debe coincidir con la versión de @playwright/test del catálogo de pnpm.
    docker:
      - image: mcr.microsoft.com/playwright:v1.64.1-noble

commands:
  install:
    description: Instala pnpm (versión de packageManager) y las dependencias, con caché.
    steps:
      - checkout
      - run:
          name: Instalar pnpm
          command: |
            PNPM_VERSION=$(node -p "require('./package.json').packageManager.split('@')[1]")
            npm config set prefix "$HOME/.npm-global"
            npm install --global "pnpm@${PNPM_VERSION}"
            echo 'export PATH="$HOME/.npm-global/bin:$PATH"' >> "$BASH_ENV"
      - restore_cache:
          keys:
            - pnpm-v1-{{ arch }}-{{ checksum "pnpm-lock.yaml" }}
            - pnpm-v1-{{ arch }}-
      - run:
          name: Instalar dependencias
          command: pnpm install --frozen-lockfile --store-dir "$HOME/.pnpm-store"
      - save_cache:
          key: pnpm-v1-{{ arch }}-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - ~/.pnpm-store
      - restore_cache:
          keys:
            - turbo-v1-{{ .Environment.CIRCLE_JOB }}-{{ .Branch }}-{{ .Revision }}
            - turbo-v1-{{ .Environment.CIRCLE_JOB }}-{{ .Branch }}-
            - turbo-v1-{{ .Environment.CIRCLE_JOB }}-

  save-turbo-cache:
    steps:
      - save_cache:
          key: turbo-v1-{{ .Environment.CIRCLE_JOB }}-{{ .Branch }}-{{ .Revision }}
          paths:
            - .turbo/cache

jobs:
  lint:
    executor: node
    steps:
      - install
      - run:
          name: ESLint
          command: pnpm lint
      - run:
          name: Prettier
          command: pnpm format:check
      - save-turbo-cache

  typecheck:
    executor: node
    steps:
      - install
      - run:
          name: TypeScript
          command: pnpm typecheck
      - save-turbo-cache

  test-layers:
    executor: node
    steps:
      - install
      - run:
          name: Pruebas de capas (sin navegador)
          command: pnpm test:layers
      - store_test_results:
          path: tests-of-layers/test-results
      - save-turbo-cache

  e2e:
    parameters:
      app:
        type: string
      shards:
        type: integer
        default: 2
    executor: playwright
    parallelism: << parameters.shards >>
    environment:
      TEST_ENV: << pipeline.parameters.test_env >>
    steps:
      - install
      # El código de salida se guarda para publicar resultados y blob aunque fallen las pruebas.
      # --only: el typecheck ya corrió en un job anterior.
      - run:
          name: Playwright
          command: |
            SHARD="$((CIRCLE_NODE_INDEX + 1))/${CIRCLE_NODE_TOTAL}"
            set +e
            pnpm turbo run test:e2e --only --filter=<< parameters.app >> -- --shard="$SHARD"
            echo $? > /tmp/e2e-exit-code
      - store_test_results:
          path: apps/<< parameters.app >>/test-results
      - store_artifacts:
          path: apps/<< parameters.app >>/test-results
          destination: << parameters.app >>/test-results
      - persist_to_workspace:
          root: .
          paths:
            - apps/<< parameters.app >>/blob-report
      - run:
          name: Resultado de Playwright
          command: exit "$(cat /tmp/e2e-exit-code)"

  e2e-report:
    parameters:
      app:
        type: string
    executor: node
    steps:
      - install
      - attach_workspace:
          at: .
      - run:
          name: Unir los reportes de los shards
          command: pnpm --filter << parameters.app >> exec playwright merge-reports --reporter html ./blob-report
      - store_artifacts:
          path: apps/<< parameters.app >>/playwright-report
          destination: << parameters.app >>/playwright-report

  docker-e2e:
    # Máquina virtual con Docker: construye la imagen del Dockerfile y corre la suite dentro,
    # igual que `docker compose run --rm qa` en local.
    machine:
      image: ubuntu-2404:current
    resource_class: medium
    environment:
      TEST_ENV: << pipeline.parameters.test_env >>
    steps:
      - checkout
      - run:
          name: Construir la imagen
          command: docker build --tag qa-monorepo .
      - run:
          name: Pruebas de capas y e2e dentro de la imagen
          command: |
            set +e
            docker run --name qa --init --ipc=host \
              --env TEST_ENV --env CIRCLE_SHA1 --env CIRCLE_BUILD_URL --env CIRCLE_BUILD_NUM \
              qa-monorepo
            echo $? > /tmp/docker-exit-code
            docker cp qa:/repo/reporte ./reporte
      - store_test_results:
          path: reporte
      - store_artifacts:
          path: reporte
          destination: reporte
      - run:
          name: Resultado
          command: exit "$(cat /tmp/docker-exit-code)"

workflows:
  qa:
    jobs:
      - lint
      - typecheck:
          requires: [lint]
      - test-layers:
          requires: [typecheck]
      # Un job por producto de apps/. Para agregar uno, súmalo a las dos listas de app.
      - e2e:
          name: e2e-<< matrix.app >>
          requires: [test-layers]
          matrix:
            parameters:
              app: [the-internet-e2e, saucedemo-e2e, restful-booker-api]
      # Corre también cuando fallan los e2e, para publicar el reporte con los fallos.
      - e2e-report:
          name: e2e-report-<< matrix.app >>
          requires:
            - e2e-<< matrix.app >>: [success, failed]
          matrix:
            parameters:
              app: [the-internet-e2e, saucedemo-e2e, restful-booker-api]
      - docker-e2e:
          requires: [test-layers]
