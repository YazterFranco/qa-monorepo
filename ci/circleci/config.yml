# Pipeline de QA: lint → typecheck → test:layers → test:e2e por producto (con sharding) → reporte.
#
# CircleCI busca .circleci/config.yml por defecto. Para usar esta ruta, en Project Settings →
# Triggers (integración con la GitHub App) apunta la fuente del config a ci/circleci/config.yml.
#
# Secretos: los jobs e2e usan el context "qa-e2e" (Organization Settings → Contexts). Créalo antes
# del primer run, aunque esté vacío. Cada credencial ${VAR} de test-data va ahí y en el
# passThroughEnv de test:e2e en turbo.json.
version: 2.1

parameters:
  test_env:
    type: string
    default: public-demo
    description: Ambiente de libs/test-data/environments que usan los e2e (TEST_ENV).

executors:
  node:
    docker:
      - image: cimg/node:24.22
  playwright:
    # Debe coincidir con la versión de @playwright/test del catálogo de pnpm.
    docker:
      - image: mcr.microsoft.com/playwright:v1.64.1-noble

commands:
  install:
    description: Instala pnpm (versión de packageManager) y las dependencias, con caché.
    steps:
      - checkout
      - run:
          name: Instalar pnpm
          command: |
            PNPM_VERSION=$(node -p "require('./package.json').packageManager.split('@')[1]")
            npm config set prefix "$HOME/.npm-global"
            npm install --global "pnpm@${PNPM_VERSION}"
            echo 'export PATH="$HOME/.npm-global/bin:$PATH"' >> "$BASH_ENV"
      - restore_cache:
          keys:
            - pnpm-v1-{{ arch }}-{{ checksum "pnpm-lock.yaml" }}
            - pnpm-v1-{{ arch }}-
      - run:
          name: Instalar dependencias
          command: pnpm install --frozen-lockfile --store-dir "$HOME/.pnpm-store"
      - save_cache:
          key: pnpm-v1-{{ arch }}-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - ~/.pnpm-store
      - restore_cache:
          keys:
            - turbo-v1-{{ .Environment.CIRCLE_JOB }}-{{ .Branch }}-{{ .Revision }}
            - turbo-v1-{{ .Environment.CIRCLE_JOB }}-{{ .Branch }}-
            - turbo-v1-{{ .Environment.CIRCLE_JOB }}-

  save-turbo-cache:
    steps:
      - save_cache:
          key: turbo-v1-{{ .Environment.CIRCLE_JOB }}-{{ .Branch }}-{{ .Revision }}
          paths:
            - .turbo/cache

jobs:
  lint:
    executor: node
    steps:
      - install
      - run:
          name: ESLint
          command: pnpm lint
      - run:
          name: Prettier
          command: pnpm format:check
      - save-turbo-cache

  typecheck:
    executor: node
    steps:
      - install
      - run:
          name: TypeScript
          command: pnpm typecheck
      - save-turbo-cache

  test-layers:
    executor: node
    steps:
      - install
      - run:
          name: Pruebas de capas (sin navegador)
          command: pnpm test:layers
      - store_test_results:
          path: tests-of-layers/test-results
      - save-turbo-cache

  e2e:
    parameters:
      app:
        type: string
      shards:
        type: integer
        default: 2
    executor: playwright
    parallelism: << parameters.shards >>
    environment:
      TEST_ENV: << pipeline.parameters.test_env >>
    steps:
      - install
      # El código de salida se guarda para publicar resultados y blob aunque fallen las pruebas.
      # --only: el typecheck ya corrió en un job anterior.
      - run:
          name: Playwright
          command: |
            SHARD="$((CIRCLE_NODE_INDEX + 1))/${CIRCLE_NODE_TOTAL}"
            set +e
            pnpm turbo run test:e2e --only --filter=<< parameters.app >> -- --shard="$SHARD"
            echo $? > /tmp/e2e-exit-code
      - store_test_results:
          path: apps/<< parameters.app >>/test-results
      - store_artifacts:
          path: apps/<< parameters.app >>/test-results
          destination: << parameters.app >>/test-results
      - persist_to_workspace:
          root: .
          paths:
            - apps/<< parameters.app >>/blob-report
      - run:
          name: Resultado de Playwright
          command: exit "$(cat /tmp/e2e-exit-code)"

  e2e-report:
    parameters:
      app:
        type: string
    executor: node
    steps:
      - install
      - attach_workspace:
          at: .
      - run:
          name: Unir los reportes de los shards
          command: pnpm --filter << parameters.app >> exec playwright merge-reports --reporter html ./blob-report
      - store_artifacts:
          path: apps/<< parameters.app >>/playwright-report
          destination: << parameters.app >>/playwright-report

workflows:
  qa:
    jobs:
      - lint
      - typecheck:
          requires: [lint]
      - test-layers:
          requires: [typecheck]
      # Un job por producto de apps/. Para agregar uno, súmalo a las dos listas de app.
      - e2e:
          name: e2e-<< matrix.app >>
          context: qa-e2e
          requires: [test-layers]
          matrix:
            parameters:
              app: [web-e2e]
      # Corre también cuando fallan los e2e, para publicar el reporte con los fallos.
      - e2e-report:
          name: e2e-report-<< matrix.app >>
          requires:
            - e2e-<< matrix.app >>: [success, failed]
          matrix:
            parameters:
              app: [web-e2e]
      # Móvil (Appium o BrowserStack App Automate), solo en ramas principales.
      # Activar cuando exista apps/mobile-e2e y su job.
      # - e2e-mobile:
      #     context: qa-e2e
      #     requires: [test-layers]
      #     filters:
      #       branches:
      #         only: [main]
